name: StudyCore Swift tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studycore-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test StudyCore
        run: swift test --package-path ios/StudyCore

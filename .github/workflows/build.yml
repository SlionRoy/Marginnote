name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        run: |
          xcodebuild -project CoordinateApp.xcodeproj -scheme CoordinateApp -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CoordinateApp.app Payload/
          zip -qry CoordinateApp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoordinateApp-unsigned-IPA
          path: CoordinateApp-unsigned.ipa
